pluginGroup = com.github.reedoverflow.stage1streader
pluginName = stage1st-reader
# SemVer; the GitHub Release tag is v<pluginVersion>.
pluginVersion = 0.0.36

# Compile against the exact minimum supported IDE. No until-build upper bound.
platformType = IC
platformVersion = 2023.3
pluginSinceBuild = 233
# The minimum IDE reuses the compilation SDK; also verify the newer Community release.
pluginVerifierIdeVersions = IC-2025.2.6.3
pluginVerifierVersion = 1.410
signingCliVersion = 0.1.43

# IntelliJ Platform Gradle Plugin 2.13.1 requires Gradle 9 and Java 17.
gradleVersion = 9.8.0
org.gradle.java.installations.fromEnv = JAVA_HOME_17_X64,JAVA_HOME_17_ARM64