# Build and verify the plugin on the IntelliJ Platform 223 baseline.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release metadata
        id: metadata
        run: python3 .github/scripts/release_metadata.py --notes-file build/release-notes.md

      - name: Test release guards
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

      # Java 17 is the language/runtime baseline for IDEA 2022.3.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Includes Gradle Wrapper validation; no separate deprecated wrapper action is needed.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build, test and verify plugin
        run: ./gradlew --no-daemon build verifyPlugin

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            build/reports/tests/
            build/reports/pluginVerifier/
          if-no-files-found: ignore
          retention-days: 14

  releaseDraft:
    name: Prepare release draft
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch verified sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare notes
        run: python3 .github/scripts/release_metadata.py --notes-file build/release-notes.md

      # Updates only this version's draft. Never deletes other releases or moves an existing tag.
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_draft.py
