# JetBrains official lifecycle: publish a GitHub Release, then publishPlugin uploads to Marketplace.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# A signing/upload operation must not be interrupted by a second release.
concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: marketplace
    permissions:
      contents: write
    steps:
      - name: Fetch tagged sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate tag, version, channel and changelog
        id: metadata
        run: python3 .github/scripts/release_metadata.py --release

      - name: Check required credentials
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: python3 .github/scripts/release_metadata.py --check-secrets

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # A manually created release gets the same checks as a draft produced by Build.
      - name: Test release guards
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Build, test and verify tagged sources
        run: ./gradlew --no-daemon check buildPlugin runPluginVerifier

      - name: Sign and publish to JetBrains Marketplace
        id: publish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon publishPlugin

      # Preserve the exact signed file even if the Marketplace upload fails, for recovery.
      - name: Preserve signed distribution
        if: ${{ always() && (steps.publish.outcome == 'success' || steps.publish.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: signed-plugin-${{ steps.metadata.outputs.version }}
          path: build/distributions/*-signed.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Attach signed ZIP to GitHub Release
        if: ${{ always() && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          SIGNED_ZIP: build/distributions/${{ steps.metadata.outputs.artifact_name }}-signed.zip
        run: gh release upload "$RELEASE_TAG" "$SIGNED_ZIP" --clobber
